<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключаем масштабирование и фиксируем размер под экран -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FunPay WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Цвета адаптируются под тему Telegram пользователя */
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --border-width: 3px;
        }

        /* Жесткая фиксация окна, чтобы оно не скроллилось как обычный сайт */
        html, body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; 
            height: 100%;
            margin: 0; 
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        /* Главный контейнер приложения */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            /* Используем динамическую высоту Telegram */
            height: var(--tg-viewport-stable-height, 100vh);
        }

        /* Шапка приложения */
        header {
            flex-shrink: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            border-bottom: var(--border-width) solid var(--text);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        header span {
            display: flex;
            flex-direction: column;
            line-height: 0.5;
            font-size: 20px;
            margin-left: 5px;
        }

        /* Основная область со скроллом (Вкладки) */
        main {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }

        .tab { display: none; }
        .tab.active { display: block; }

        /* Крупные кнопки-блоки (как на скетче) */
        .menu-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: var(--border-width) solid var(--text);
            color: var(--text);
            padding: 18px 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: left;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .menu-btn:active { background-color: rgba(128, 128, 128, 0.2); }

        /* Скрытые подменю */
        .submenu { display: none; padding-left: 20px; margin-bottom: 15px; border-left: var(--border-width) solid var(--text); }
        .submenu.open { display: block; }
        .submenu input { width: 100%; padding: 12px; border: var(--border-width) solid var(--text); background: transparent; color: var(--text); font-size: 16px; margin-bottom: 10px; font-weight: bold;}
        .submenu label { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        /* Нижнее навигационное меню */
        nav {
            flex-shrink: 0;
            height: 70px;
            display: flex;
            border-top: var(--border-width) solid var(--text);
            background-color: var(--bg);
            /* Учет "челки" на iPhone */
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: var(--border-width) solid var(--text);
            font-size: 32px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-item:last-child { border-right: none; }
        .nav-item.active { background-color: rgba(128, 128, 128, 0.2); }

        /* Элементы профиля и товаров */
        .empty-state { text-align: center; font-size: 18px; font-weight: bold; margin-top: 40px; color: var(--hint); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { border: var(--border-width) solid var(--text); text-align: center; font-weight: bold; display: flex; flex-direction: column; }
        .card-img { height: 100px; border-bottom: var(--border-width) solid var(--text); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .card-price { padding: 10px; border-bottom: var(--border-width) solid var(--text); font-size: 18px; }
        .card-title { padding: 10px; font-size: 16px; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <header>
        funPay 
        <span>
            <b>▲</b>
            <b>▼</b>
        </span>
    </header>

    <!-- Основной контент -->
    <main>
        
        <!-- Вкладка: Настройки (По умолчанию) -->
        <div id="tab-settings" class="tab active">
            
            <button class="menu-btn" onclick="toggleSub('sub-prof')">Настройки проф.</button>
            <div id="sub-prof" class="submenu">
                <input type="text" placeholder="Новый ник">
                <button class="menu-btn" style="font-size:18px; padding:12px;">Изменить ник</button>
                <button class="menu-btn" style="font-size:18px; padding:12px;">Изменить аватарку</button>
                <button class="menu-btn" style="font-size:18px; padding:12px;">Подать заявку</button>
            </div>

            <button class="menu-btn" onclick="toggleSub('sub-conf')">Настройки конфид.</button>
            <div id="sub-conf" class="submenu">
                <label><input type="checkbox" style="width: 25px; height: 25px;"> Скрытный режим</label>
            </div>

            <button class="menu-btn" onclick="toggleSub('sub-chat')">Настройки чатов</button>
            <div id="sub-chat" class="submenu">
                <label><input type="checkbox" checked style="width: 25px; height: 25px;"> Авто-отправка</label>
            </div>

            <button class="menu-btn" onclick="tg.openLink('https://staticgram.top/kalba')">Поддержка</button>
        </div>

        <!-- Вкладка: Админ панель -->
        <div id="tab-admin" class="tab">
            <h2 style="text-align: center; margin-bottom: 20px;">Админ Панель</h2>
            <button class="menu-btn" onclick="tg.sendData('admin_users')">Управление юзерами</button>
            <button class="menu-btn" onclick="tg.sendData('admin_stars')">Выдача звезд</button>
            <button class="menu-btn" onclick="tg.sendData('admin_logs')">Логи сделок</button>
        </div>

        <!-- Вкладка: Sell (Мои товары) -->
        <div id="tab-sell" class="tab">
            <button class="menu-btn" onclick="tg.sendData('create_item')" style="text-align: center;">+ Создать товар</button>
            <div class="grid" id="my-list">
                <div class="empty-state" style="grid-column: 1/-1;">У вас пока нет активных товаров</div>
            </div>
        </div>

        <!-- Вкладка: Профиль -->
        <div id="tab-profile" class="tab">
            <div style="text-align: center; border-bottom: var(--border-width) solid var(--text); padding-bottom: 20px;">
                <div style="width: 120px; height: 120px; border: var(--border-width) solid var(--text); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 50px;">👤</div>
                <h1 style="margin: 15px 0 5px;" id="username">Ник</h1>
            </div>
            <div style="font-size: 22px; font-weight: bold; line-height: 1.8; margin-top: 15px;">
                <div>Рейтинг продавца: 5.0 ⭐</div>
                <div>Рейтинг покупателя: 4.9 ⭐</div>
                <div>Продаж: 0</div>
                <div>Покупок: 0</div>
            </div>
        </div>

    </main>

    <!-- Нижнее меню -->
    <nav>
        <!-- 1. Админ панель (Замок) - Скрыта по умолчанию -->
        <div class="nav-item" id="nav-admin" style="display: none;" onclick="switchTab('admin')">🔒</div>
        
        <!-- 2. Sell -->
        <div class="nav-item" id="nav-sell" onclick="switchTab('sell')" style="font-family: 'Comic Sans MS', cursive;">Sell</div>
        
        <!-- 3. Настройки (Шестеренка) -->
        <div class="nav-item active" id="nav-settings" onclick="switchTab('settings')">⚙️</div>
        
        <!-- 4. Профиль (Человечек) -->
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">👤</div>
    </nav>
</div>

<script>
    const tg = window.Telegram.WebApp;
    
    // КРИТИЧЕСКИ ВАЖНО: Команда разворачивает WebApp на 100% высоты экрана
    tg.expand(); 
    tg.ready();

    // Проверка на админа
    const MAIN_ADMIN_ID = "1780243962"; 
    const user = tg.initDataUnsafe?.user || { id: "1780243962", first_name: "Admin" };
    
    document.getElementById('username').innerText = user.first_name || user.username || "Аноним";

    // Открываем вкладку с замком, если ID совпадает
    if (String(user.id) === MAIN_ADMIN_ID) {
        document.getElementById('nav-admin').style.display = 'flex';
    }

    // Логика переключения вкладок
    function switchTab(tabId) {
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');
    }

    // Раскрытие меню
    function toggleSub(id) {
        document.getElementById(id).classList.toggle('open');
    }
</script>

</body>
</html>
