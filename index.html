<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FunPay WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #121212);
            --sec-bg: var(--tg-theme-secondary-bg-color, #1c1c1d);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --accent: #f5a623;
            --accent-text: #000000;
            --danger: #ff453a;
            --success: #32d74b;
            --border: rgba(128, 128, 128, 0.2);
            --radius: 14px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
        }

        .app-container { display: flex; flex-direction: column; width: 100%; height: var(--tg-viewport-stable-height, 100vh); }

        header {
            flex-shrink: 0; height: 54px; background-color: var(--sec-bg);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; font-size: 22px; font-weight: 800; border-bottom: 1px solid var(--border); z-index: 10;
        }
        .header-logo span { color: var(--accent); }
        .header-bal {
            font-size: 14px; font-weight: 700; background: rgba(245, 166, 35, 0.15);
            color: var(--accent); padding: 6px 12px; border-radius: 20px; cursor: pointer;
        }

        main { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; padding-bottom: 30px; }
        .tab { display: none; animation: fade 0.2s ease; }
        .tab.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 19px; margin: 0 0 14px 0; font-weight: 700; }

        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            background: var(--accent); color: var(--accent-text); border: none;
            padding: 14px; font-size: 16px; font-weight: 700; border-radius: 12px;
            cursor: pointer; transition: transform 0.1s; margin-bottom: 12px; gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn.secondary { background: var(--sec-bg); color: var(--text); border: 1px solid var(--border); }
        .btn.danger { background: var(--danger); color: #fff; }
        .btn.success { background: var(--success); color: #000; }

        .input {
            width: 100%; padding: 13px 14px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--sec-bg);
            color: var(--text); font-size: 15px; margin-bottom: 12px; outline: none;
        }
        .input:focus { border-color: var(--accent); }
        textarea.input { resize: none; height: 90px; }

        .list-group { background-color: var(--sec-bg); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; border: 1px solid var(--border); }
        .list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 16px; font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .list-item:active { background-color: rgba(128, 128, 128, 0.15); }
        .list-item:last-child { border-bottom: none; }
        .list-item-title { display: flex; align-items: center; gap: 12px; }
        .list-icon { font-size: 20px; width: 24px; text-align: center; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background-color: var(--sec-bg); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; border: 1px solid var(--border); cursor: pointer;
        }
        .card:active { transform: scale(0.97); }
        .card-photo {
            height: 110px; background: rgba(0,0,0,0.25); display: flex;
            align-items: center; justify-content: center; border-bottom: 1px solid var(--border);
            overflow: hidden; position: relative;
        }
        .card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .card-cat-badge {
            position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.65);
            color: #fff; font-size: 10px; padding: 3px 7px; border-radius: 6px;
        }
        .card-price { padding: 8px 10px; font-weight: 800; font-size: 15px; color: var(--accent); border-bottom: 1px solid var(--border); }
        .card-title { padding: 8px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .empty-state {
            grid-column: 1 / -1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 36px 20px;
            color: var(--hint); text-align: center; font-size: 14px;
        }
        .empty-state span { font-size: 38px; margin-bottom: 8px; opacity: 0.6; }

        .profile-header { display: flex; flex-direction: column; align-items: center; padding: 10px 0 18px; }
        .avatar {
            width: 86px; height: 86px; border-radius: 50%; background-color: var(--sec-bg);
            border: 2px solid var(--accent); display: flex; align-items: center;
            justify-content: center; font-size: 38px; margin-bottom: 10px;
        }
        .username { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .verified { background: var(--accent); color: #000; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

        .sub-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .sub-tab {
            flex: 1; padding: 10px; text-align: center; background: var(--sec-bg);
            border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer; color: var(--hint);
        }
        .sub-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 100; display: none;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; animation: fade 0.15s ease; }
        .modal-box {
            width: 100%; max-height: 88vh; background: var(--bg);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            border-top: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            padding: 14px 16px; background: var(--sec-bg); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 17px;
        }
        .modal-close {
            background: rgba(128,128,128,0.2); border: none; color: var(--text);
            width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer;
        }
        .modal-body { padding: 16px; overflow-y: auto; }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #2c2c2e; color: #fff; padding: 10px 18px; border-radius: 25px;
            font-size: 14px; font-weight: 600; z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid var(--accent); display: none; white-space: nowrap;
        }

        nav {
            flex-shrink: 0; height: calc(58px + env(safe-area-inset-bottom));
            display: flex; background-color: var(--sec-bg); border-top: 1px solid var(--border);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: var(--hint); cursor: pointer; gap: 3px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 21px; }
        .nav-text { font-size: 10px; font-weight: 600; }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="app-container">
    <header>
        <div class="header-logo">Fun<span>Pay</span> ↕</div>
        <div class="header-bal" onclick="switchTab('profile')" id="top-bal">0 ⭐</div>
    </header>

    <main>
        <!-- 1. МАРКЕТ -->
        <div id="tab-market" class="tab active">
            <input type="text" id="market-search" class="input" placeholder="🔍 Поиск по названию или игре..." oninput="renderMarket()">
            <h2>Каталог сделок</h2>
            <div class="grid" id="market-list"></div>
        </div>

        <!-- 2. СДЕЛКИ И ЧАТЫ -->
        <div id="tab-chats" class="tab">
            <div class="sub-tabs">
                <div class="sub-tab active" id="st-purchases" onclick="switchSubTab('purchases')">🛍 Покупки</div>
                <div class="sub-tab" id="st-sales" onclick="switchSubTab('sales')">💰 Продажи</div>
                <div class="sub-tab" id="st-dialogs" onclick="switchSubTab('dialogs')">💬 Чаты</div>
            </div>
            <div id="subtab-content"></div>
        </div>

        <!-- 3. ПРОДАЖА / МОИ ТОВАРЫ -->
        <div id="tab-sell" class="tab">
            <button class="btn" onclick="openCreateItemModal()">
                <span style="font-size: 20px;">+</span> Создать товар
            </button>
            <h2 style="margin-top: 8px;">Мои товары</h2>
            <div class="grid" id="my-list"></div>
        </div>

        <!-- 4. НАСТРОЙКИ -->
        <div id="tab-settings" class="tab">
            <h2>Настройки</h2>
            <div class="list-group">
                <div class="list-item" onclick="openKalbaLink()">
                    <div class="list-item-title"><span class="list-icon">🆘</span> Поддержка (@kalba)</div>
                    <span style="color: var(--hint); font-size: 18px;">↗</span>
                </div>
            </div>
        </div>

        <!-- 5. ПРОФИЛЬ -->
        <div id="tab-profile" class="tab">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div class="username">
                    <span id="username-display">Ник</span>
                    <span id="user-verif-badge" class="verified" style="display:none;">✔</span>
                </div>
                <div style="font-size: 13px; color: var(--hint); margin-bottom: 6px;">ID: <code id="userid-display">0</code></div>
                <button class="btn secondary" style="width:auto; padding:6px 14px; font-size:13px;" onclick="syncWithBackend(true)">🔄 Синхронизировать баланс</button>
            </div>
        </div>

        <!-- 6. АДМИН ПАНЕЛЬ -->
        <div id="tab-admin" class="tab">
            <h2 style="color: var(--accent);">🛠 Админ-панель</h2>
            <div class="list-group">
                <div class="list-item" onclick="openAdminStats()"><div class="list-item-title">📊 Статистика</div><span style="color: var(--hint);">›</span></div>
            </div>
        </div>
    </main>

    <nav>
        <div class="nav-item active" id="nav-market" onclick="switchTab('market')"><div class="nav-icon">🛒</div><div class="nav-text">Маркет</div></div>
        <div class="nav-item" id="nav-chats" onclick="switchTab('chats')"><div class="nav-icon">💬</div><div class="nav-text">Сделки</div></div>
        <div class="nav-item" id="nav-sell" onclick="switchTab('sell')"><div class="nav-icon">📦</div><div class="nav-text">Продажа</div></div>
        <div class="nav-item" id="nav-settings" onclick="switchTab('settings')"><div class="nav-icon">⚙️</div><div class="nav-text">Настройки</div></div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')"><div class="nav-icon">👤</div><div class="nav-text">Профиль</div></div>
        <div class="nav-item" id="nav-admin" style="display: none;" onclick="switchTab('admin')"><div class="nav-icon">🛡️</div><div class="nav-text">Админ</div></div>
    </nav>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
        <div class="modal-header">
            <span id="modal-title">Заголовок</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const MAIN_ADMIN_ID = 1780243962;
    const urlParams = new URLSearchParams(window.location.search);
    const tgUser = tg?.initDataUnsafe?.user || {
        id: parseInt(urlParams.get("uid")) || MAIN_ADMIN_ID,
        first_name: "kalba",
        username: "kalba"
    };

    const API_BASE = urlParams.get("api") || "";

    let state = {
        users: [{ id: tgUser.id, name: tgUser.first_name || "User", uname: tgUser.username || "user", bal: parseInt(urlParams.get("bal")) || 0, verif: "", banned_until: 0 }],
        admins: [MAIN_ADMIN_ID],
        listings: [],
        orders: [],
        reviews: []
    };

    if (urlParams.has("bal")) {
        let u = state.users.find(x => String(x.id) === String(tgUser.id));
        if (u) u.bal = parseInt(urlParams.get("bal")) || 0;
    }

    function currentUser() {
        let u = state.users.find(x => String(x.id) === String(tgUser.id));
        if (!u) {
            u = { id: tgUser.id, name: tgUser.first_name || "User", uname: tgUser.username || "user", bal: 0, verif: "", banned_until: 0 };
            state.users.push(u);
        }
        return u;
    }

    async function syncWithBackend(manual = false) {
        try {
            const res = await fetch(`${API_BASE}/api/state?uid=${tgUser.id}&name=${encodeURIComponent(tgUser.first_name||'')}&uname=${encodeURIComponent(tgUser.username||'')}`);
            if (res.ok) {
                const data = await res.json();
                if (data.ok) {
                    state.users = data.users;
                    state.admins = data.admins;
                    state.listings = data.listings;
                    state.orders = data.orders;
                    state.reviews = data.reviews;
                    updateTopProfile();
                    renderMarket();
                    renderMyListings();
                    if (manual) showToast("✅ Синхронизировано!");
                    return;
                }
            }
        } catch (e) {}
        updateTopProfile();
        if (manual) showToast(`⭐ Баланс: ${currentUser().bal} ⭐`);
    }

    async function apiCall(payload) {
        try {
            const res = await fetch(`${API_BASE}/api/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ uid: tgUser.id, ...payload })
            });
            if (res.ok) {
                const data = await res.json();
                await syncWithBackend();
                return data;
            }
        } catch (e) {}
        return null;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => t.style.display = 'none', 2600);
    }

    function openModal(title, htmlContent) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = htmlContent;
        document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
    }

    function updateTopProfile() {
        const u = currentUser();
        document.getElementById('top-bal').innerText = `${u.bal} ⭐`;
        document.getElementById('username-display').innerText = (u.name || u.uname);
        document.getElementById('userid-display').innerText = u.id;

        const badge = document.getElementById('user-verif-badge');
        if (u.verif === 'staff') { badge.style.display = 'inline-flex'; badge.innerText = '🛡'; }
        else if (u.verif === 'funpay') { badge.style.display = 'inline-flex'; badge.innerText = '⭐'; }
        else { badge.style.display = 'none'; }

        const isAdmin = state.admins.map(String).includes(String(u.id)) || urlParams.get("admin") === "1";
        document.getElementById('nav-admin').style.display = isAdmin ? 'flex' : 'none';
    }

    function switchTab(tabId) {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');

        if (tabId === 'market') renderMarket();
        if (tabId === 'sell') renderMyListings();
        if (tabId === 'chats') renderSubTab();
        syncWithBackend();
    }

    function getSellerPrefix(seller_id) {
        const s = state.users.find(x => String(x.id) === String(seller_id));
        if (!s) return "";
        if (s.verif === "staff") return "🛡 ";
        if (s.verif === "funpay") return "⭐ ";
        return "";
    }

    function isUserBanned(uid) {
        const u = state.users.find(x => String(x.id) === String(uid));
        return u && u.banned_until && u.banned_until > (Date.now() / 1000);
    }

    function renderMarket() {
        const q = (document.getElementById('market-search')?.value || "").toLowerCase();
        const container = document.getElementById('market-list');
        const activeItems = state.listings.filter(item =>
            item.active && item.amount > 0 && !isUserBanned(item.seller_id) &&
            ((item.title || "").toLowerCase().includes(q) || (item.game || "").toLowerCase().includes(q))
        );

        if (activeItems.length === 0) {
            container.innerHTML = `<div class="empty-state"><span>🛒</span>Пока нет активных товаров</div>`;
            return;
        }

        container.innerHTML = activeItems.map(item => `
            <div class="card" onclick="openItemCard(${item.id})">
                <div class="card-photo">
                    <span class="card-cat-badge">${item.game || item.category}</span>
                    ${item.media_id || item.photo ? `<img src="${item.media_id || item.photo}">` : `<span style="font-size:28px;">📦</span>`}
                </div>
                <div class="card-price">${item.price} ⭐</div>
                <div class="card-title">${getSellerPrefix(item.seller_id)}${item.title}</div>
            </div>
        `).join('');
    }

    function renderMyListings() {
        const u = currentUser();
        const container = document.getElementById('my-list');
        const myItems = state.listings.filter(item => String(item.seller_id) === String(u.id) && item.active && item.amount > 0);

        if (myItems.length === 0) {
            container.innerHTML = "";
            return;
        }

        container.innerHTML = myItems.map(item => `
            <div class="card" onclick="openItemCard(${item.id})">
                <div class="card-photo">
                    <span class="card-cat-badge">${item.amount} шт.</span>
                    ${item.media_id || item.photo ? `<img src="${item.media_id || item.photo}">` : `<span style="font-size:28px;">📦</span>`}
                </div>
                <div class="card-price">${item.price} ⭐</div>
                <div class="card-title">${getSellerPrefix(item.seller_id)}${item.title}</div>
            </div>
        `).join('');
    }

    function openCreateItemModal() {
        openModal("➕ Создать товар", `
            <select id="ci-cat" class="input">
                <option value="Аккаунты">Аккаунты</option>
                <option value="Игры">Игры</option>
                <option value="Подписки">Подписки</option>
                <option value="Валюта">Валюта</option>
                <option value="Прочее">Прочее</option>
            </select>
            <input type="text" id="ci-game" class="input" placeholder="Игра или сервис (например: Steam, Telegram)">
            <input type="text" id="ci-title" class="input" placeholder="Название товара">
            <input type="number" id="ci-price" class="input" placeholder="Цена в Stars (⭐)">
            <input type="number" id="ci-amount" class="input" placeholder="Количество" value="1">
            <input type="text" id="ci-photo" class="input" placeholder="Ссылка на фото (необязательно)">
            <textarea id="ci-desc" class="input" placeholder="Описание товара..."></textarea>
            <input type="text" id="ci-auto" class="input" placeholder="Текст автовыдачи">
            <button class="btn" onclick="submitCreateItem()">✅ Опубликовать</button>
        `);
    }

    async function submitCreateItem() {
        const category = document.getElementById('ci-cat').value;
        const game = document.getElementById('ci-game').value.trim() || "Общее";
        const title = document.getElementById('ci-title').value.trim();
        const price = parseInt(document.getElementById('ci-price').value);
        const amount = parseInt(document.getElementById('ci-amount').value) || 1;
        const photo = document.getElementById('ci-photo').value.trim();
        const description = document.getElementById('ci-desc').value.trim();
        const auto_text = document.getElementById('ci-auto').value.trim();

        if (!title || isNaN(price) || price <= 0 || !description) return showToast("❌ Заполните обязательные поля!");
        if (/^(⭐|🌟|💫|✨|<emoji)/i.test(title) || /верифицирован|verified|funpay\s*staff/i.test(title)) return showToast("❌ Ошибка в названии!");
        if (/верифицирован|verified|funpay\s*staff|гарант/i.test(description)) return showToast("❌ Ошибка в описании!");

        const res = await apiCall({ action: "create_item", category, game, title, price, amount, photo, description, auto_text });
        if (res && !res.ok) return showToast("❌ " + res.error);
        closeModal();
        renderMyListings();
        renderMarket();
        showToast("✅ Товар создан!");
    }

    function openItemCard(itemId) {
        const item = state.listings.find(x => x.id === itemId);
        if (!item) return;
        const seller = state.users.find(x => String(x.id) === String(item.seller_id)) || { name: "Продавец", id: item.seller_id };
        const u = currentUser();

        let verifLine = "";
        if (seller.verif === "staff") verifLine = `<div style="margin-top:10px;"><b><i>🛡 Аккаунт верифицирован «FunPay Staff».</i></b></div>`;
        else if (seller.verif === "funpay") verifLine = `<div style="margin-top:10px;"><b><i>⭐ Аккаунт верифицирован «FunPay».</i></b></div>`;

        const canManage = String(item.seller_id) === String(u.id) || state.admins.map(String).includes(String(u.id));

        openModal("Карточка товара", `
            ${item.media_id || item.photo ? `<img src="${item.media_id || item.photo}" style="width:100%; height:160px; object-fit:cover; border-radius:12px; margin-bottom:12px;">` : ''}
            <div style="font-size:18px; font-weight:800; margin-bottom:8px;">${getSellerPrefix(item.seller_id)}${item.title}</div>
            <div style="color:var(--hint); font-size:14px; white-space:pre-wrap; margin-bottom:14px;">${item.description}</div>
            <div class="list-group" style="padding:12px; font-size:14px; line-height:1.7;">
                <div>• Цена: <b style="color:var(--accent);">${item.price} ⭐</b></div>
                <div>• В наличии: <b>${item.amount} шт.</b></div>
                <div>• Продавец: <b style="cursor:pointer; color:var(--accent);" onclick="openSellerReviews(${seller.id}, '${seller.name || seller.uname}')">${seller.name || seller.uname} (Отзывы ⭐)</b></div>
                ${verifLine}
            </div>
            ${String(item.seller_id) !== String(u.id) ? `<button class="btn" onclick="buyItem(${item.id})">💳 Купить за ${item.price} ⭐</button>` : ''}
            ${canManage ? `<button class="btn danger" onclick="deleteItem(${item.id})">🗑 Удалить</button>` : ''}
        `);
    }

    async function deleteItem(itemId) {
        await apiCall({ action: "delete_item", item_id: itemId });
        closeModal();
        syncWithBackend();
        showToast("🗑 Товар удален");
    }

    async function buyItem(itemId) {
        const item = state.listings.find(x => x.id === itemId);
        const u = currentUser();
        if (u.bal < item.price) return showToast("❌ Недостаточно средств! Пополните баланс в боте.");
        const res = await apiCall({ action: "buy_item", item_id: itemId });
        if (res && !res.ok) return showToast("❌ " + res.error);
        closeModal();
        switchTab('chats');
        showToast("✅ Покупка успешна!");
    }

    // Отзывы продавца
    function openSellerReviews(sellerId, sellerName) {
        const revs = state.reviews.filter(r => String(r.seller_id) === String(sellerId) && !r.reported);
        const avg = revs.length ? (revs.reduce((a,b)=>a+b.rating,0)/revs.length).toFixed(1) : "5.0";

        openModal(`Отзывы о ${sellerName}`, `
            <div style="font-size:16px; font-weight:700; margin-bottom:12px;">Рейтинг: ⭐ ${avg} / 5 (Отзывов: ${revs.length})</div>
            ${revs.length === 0 ? `<div class="empty-state">Пока нет отзывов</div>` : revs.map(r => `
                <div class="list-group" style="padding:12px; font-size:14px; margin-bottom:8px;">
                    <div><b>${r.rating} ⭐</b> ${r.anonymous ? '<i>(Анонимно)</i>' : ''}</div>
                    <div style="margin-top:4px; color:var(--hint);">${r.comment}</div>
                    <button class="btn secondary" style="margin-top:8px; padding:6px; font-size:12px;" onclick="reportReview(${r.id})">🚨 Пожаловаться</button>
                </div>
            `).join('')}
        `);
    }

    async function reportReview(reviewId) {
        await apiCall({ action: "report_review", review_id: reviewId });
        closeModal();
        showToast("✅ Жалоба отправлена админу");
    }

    let currentSubTab = 'purchases';
    function switchSubTab(st) {
        currentSubTab = st;
        document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
        document.getElementById('st-' + st).classList.add('active');
        renderSubTab();
    }

    function renderSubTab() {
        const u = currentUser();
        const box = document.getElementById('subtab-content');

        if (currentSubTab === 'purchases') {
            const list = state.orders.filter(o => String(o.buyer_id) === String(u.id));
            if (!list.length) { box.innerHTML = `<div class="empty-state"><span>🛍</span>У вас нет покупок</div>`; return; }
            box.innerHTML = list.map(o => `
                <div class="list-group" style="padding:14px;">
                    <div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px;">
                        <span>Сделка #${o.id}</span>
                        <span style="color:var(--accent);">${o.price} ⭐</span>
                    </div>
                    <div style="font-size:13px; color:var(--hint); margin-bottom:10px;">Статус: <b>${o.status}</b></div>
                    ${o.status === 'pending' ? `
                        <div style="display:flex; gap:8px; margin-bottom:8px;">
                            <button class="btn success" style="margin:0; padding:10px;" onclick="confirmOrder(${o.id})">✅ Подтвердить</button>
                            <button class="btn danger" style="margin:0; padding:10px;" onclick="disputeOrder(${o.id})">⚠️ Спор</button>
                        </div>
                    ` : ''}
                    ${o.status === 'completed' && !state.reviews.some(r => String(r.order_id) === String(o.id)) ? `
                        <button class="btn" style="margin:0; padding:10px;" onclick="openReviewModal(${o.id}, ${o.seller_id})">⭐ Оставить отзыв</button>
                    ` : ''}
                </div>
            `).join('');
        } else if (currentSubTab === 'sales') {
            const list = state.orders.filter(o => String(o.seller_id) === String(u.id));
            if (!list.length) { box.innerHTML = `<div class="empty-state"><span>💰</span>У вас нет продаж</div>`; return; }
            box.innerHTML = list.map(o => `
                <div class="list-group" style="padding:14px;">
                    <div style="display:flex; justify-content:space-between; font-weight:700;">
                        <span>Сделка #${o.id}</span>
                        <span style="color:var(--accent);">${o.price} ⭐</span>
                    </div>
                    <div style="font-size:13px; color:var(--hint); margin-top:6px;">Статус: ${o.status}</div>
                </div>
            `).join('');
        } else {
            box.innerHTML = `<div class="empty-state"><span>💬</span>Чаты доступны через бота в Telegram</div>`;
        }
    }

    async function confirmOrder(orderId) {
        await apiCall({ action: "confirm_order", order_id: orderId });
        renderSubTab();
        showToast("✅ Заказ подтвержден!");
    }

    async function disputeOrder(orderId) {
        await apiCall({ action: "dispute_order", order_id: orderId });
        renderSubTab();
        showToast("🚨 Запрос возврата (спор) отправлен!");
    }

    function openReviewModal(orderId, sellerId) {
        openModal("⭐ Оставить отзыв", `
            <select id="rev-rating" class="input">
                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                <option value="4">⭐⭐⭐⭐ (4)</option>
                <option value="3">⭐⭐⭐ (3)</option>
                <option value="2">⭐⭐ (2)</option>
                <option value="1">⭐ (1)</option>
            </select>
            <textarea id="rev-text" class="input" placeholder="Напишите комментарий к отзыву..."></textarea>
            <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:14px;">
                <input type="checkbox" id="rev-anon" style="width:18px; height:18px;"> Оставить отзыв анонимно
            </label>
            <button class="btn" onclick="submitReview(${orderId})">📤 Отправить отзыв</button>
        `);
    }

    async function submitReview(orderId) {
        const rating = parseInt(document.getElementById('rev-rating').value);
        const comment = document.getElementById('rev-text').value.trim() || "Без комментария";
        const anonymous = document.getElementById('rev-anon').checked ? 1 : 0;
        await apiCall({ action: "add_review", order_id: orderId, rating, comment, anonymous });
        closeModal();
        renderSubTab();
        showToast("✅ Отзыв опубликован!");
    }

    function openTransferModal() {
        openModal("💸 Перевести звезды", `
            <input type="text" id="tr-target" class="input" placeholder="Username (@username) или ID">
            <input type="number" id="tr-amt" class="input" placeholder="Сумма (⭐)">
            <button class="btn" onclick="submitTransfer()">Перевести</button>
        `);
    }

    async function submitTransfer() {
        const target = document.getElementById('tr-target').value.trim().replace(/^@/, '');
        const amount = parseInt(document.getElementById('tr-amt').value);
        const res = await apiCall({ action: "transfer", target, amount });
        if (res && !res.ok) return showToast("❌ " + res.error);
        closeModal();
        showToast("✅ Перевод выполнен!");
    }

    function openAdminStats() {
        openModal("📊 Статистика", `
            <div class="list-group" style="padding:14px; line-height:1.8;">
                <div>• Пользователей: <b>${state.users.length}</b></div>
                <div>• Сделок: <b>${state.orders.length}</b></div>
                <div>• Отзывов: <b>${state.reviews.length}</b></div>
            </div>
        `);
    }

    syncWithBackend();
    renderMarket();
    setInterval(() => syncWithBackend(), 5000);
</script>
</body>
</html>
