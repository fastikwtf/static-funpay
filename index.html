<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunPay Stars Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen pb-16">
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>

    <header class="sticky top-0 bg-gray-900/90 backdrop-blur border-b border-gray-800 p-4 flex justify-between items-center z-50">
        <h1 class="text-lg font-bold bg-gradient-to-r from-yellow-400 to-amber-500 bg-clip-text text-transparent">FunPay Stars ⭐</h1>
        <div id="user-balance" class="text-xs bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700 text-yellow-400 font-semibold">
            ⭐ Загрузка...
        </div>
    </header>

    <nav class="flex border-b border-gray-800 bg-gray-900/40">
        <button onclick="switchTab('market')" id="btn-market" class="flex-1 py-3 text-sm font-medium border-b-2 border-yellow-500 text-yellow-400 text-center">Каталог</button>
        <button onclick="switchTab('sell')" id="btn-sell" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 text-center">Продать</button>
        <button onclick="switchTab('orders')" id="btn-orders" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 text-center">Сделки</button>
        <button onclick="switchTab('profile')" id="btn-profile" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 text-center">Профиль</button>
    </nav>

    <main class="p-4 max-w-xl mx-auto">
        <!-- Каталог -->
        <section id="tab-market" class="space-y-4">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="filterCategory('all')" class="px-3 py-1 bg-yellow-600 text-white text-xs rounded-full whitespace-nowrap">Все</button>
                <button onclick="filterCategory('Аккаунты')" class="px-3 py-1 bg-gray-800 text-gray-300 text-xs rounded-full whitespace-nowrap border border-gray-700">Аккаунты</button>
                <button onclick="filterCategory('Игры')" class="px-3 py-1 bg-gray-800 text-gray-300 text-xs rounded-full whitespace-nowrap border border-gray-700">Игры</button>
                <button onclick="filterCategory('Подписки')" class="px-3 py-1 bg-gray-800 text-gray-300 text-xs rounded-full whitespace-nowrap border border-gray-700">Подписки</button>
                <button onclick="filterCategory('Валюта')" class="px-3 py-1 bg-gray-800 text-gray-300 text-xs rounded-full whitespace-nowrap border border-gray-700">Валюта</button>
            </div>
            <div id="listings-container" class="space-y-3"></div>
        </section>

        <!-- Продать -->
        <section id="tab-sell" class="hidden space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
                <h2 class="text-base font-semibold mb-3">Выставить лот за Telegram Stars</h2>
                <form id="sell-form" onsubmit="createListing(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Категория</label>
                        <select id="item-category" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                            <option value="Аккаунты">Аккаунты</option>
                            <option value="Игры">Игры</option>
                            <option value="Подписки">Подписки</option>
                            <option value="Валюта">Валюта</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Игра / Сервис</label>
                        <input type="text" id="item-game" required placeholder="Например: Steam, Telegram" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Название товара</label>
                        <input type="text" id="item-title" required placeholder="Например: Prime CS2 + 75 игр" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Цена в Telegram Stars (⭐)</label>
                        <input type="number" id="item-price" required min="1" placeholder="100" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-yellow-500">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Описание</label>
                        <textarea id="item-desc" rows="3" required placeholder="Детали передачи товара..." class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-yellow-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-700 font-medium py-3 rounded-xl text-sm transition">Опубликовать за ⭐</button>
                </form>
            </div>
        </section>

        <!-- Сделки -->
        <section id="tab-orders" class="hidden space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
                <h2 id="orders-count" class="text-base font-semibold mb-3">Сделки: 0</h2>
                <div id="orders-container" class="space-y-3">
                    <p class="text-xs text-gray-400">Пока нет сделок</p>
                </div>
            </div>
        </section>

        <!-- Профиль -->
        <section id="tab-profile" class="hidden space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 text-center">
                <div class="w-16 h-16 bg-yellow-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold mb-2">👤</div>
                <h2 id="profile-name" class="font-bold text-base">Пользователь</h2>
                <p id="profile-id" class="text-xs text-gray-400 mb-4">ID: ...</p>
                <div id="profile-bal" class="bg-gray-800 p-3 rounded-xl border border-gray-700 font-semibold text-yellow-400">Баланс: 0 ⭐</div>
            </div>
        </section>
    </main>

    <script>
        // 📌 ВСТАВЬ СЮДА ССЫЛКУ НА СВОЙ PYTHON-БЭКЕНД
        const BACKEND_URL = "https://YOUR-BACKEND-URL.com";

        const userId = window.Telegram.WebApp.initDataUnsafe?.user?.id || 1780243962;
        let currentCategory = 'all';
        let allListings = [];

        function switchTab(tab) {
            ['market', 'sell', 'orders', 'profile'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 text-center";
            });
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "flex-1 py-3 text-sm font-medium border-b-2 border-yellow-500 text-yellow-400 text-center";
            if (tab === 'market') fetchListings();
            if (tab === 'orders') fetchOrders();
            if (tab === 'profile') fetchUserData();
        }

        async function fetchUserData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user/${userId}`);
                const user = await res.json();
                document.getElementById('profile-name').innerText = user.name || 'Пользователь';
                document.getElementById('profile-id').innerText = `ID: ${user.id}`;
                document.getElementById('profile-bal').innerText = `Баланс: ${user.bal} ⭐`;
                document.getElementById('user-balance').innerText = `⭐ ${user.bal}`;
            } catch (e) { console.error(e); }
        }

        async function fetchListings() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/listings`);
                allListings = await res.json();
                renderListings();
                fetchUserData();
            } catch (e) { console.error(e); }
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user_orders/${userId}`);
                const orders = await res.json();
                const container = document.getElementById('orders-container');
                document.getElementById('orders-count').innerText = `Кол-во сделок: ${orders.length}`;
                container.innerHTML = '';
                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-400">Пока нет сделок</p>';
                    return;
                }
                orders.forEach(o => {
                    const role = o.buyer_id === userId ? 'Покупатель' : 'Продавец';
                    container.innerHTML += `
                        <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 text-xs space-y-1">
                            <div class="font-bold text-yellow-400">Сделка #${o.id} [${role}]</div>
                            <div>Лот ID: ${o.listing_id} | Цена: ${o.price} ⭐</div>
                            <div class="text-gray-400">Статус: ${o.status}</div>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        function renderListings() {
            const container = document.getElementById('listings-container');
            container.innerHTML = '';
            const filtered = currentCategory === 'all' ? allListings : allListings.filter(i => i.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-6 text-sm">В этой категории пока нет товаров</p>';
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[10px] bg-yellow-500/20 text-yellow-300 px-2 py-0.5 rounded-md font-medium">${item.game}</span>
                                <span class="text-yellow-400 font-bold text-sm">⭐ ${item.price}</span>
                            </div>
                            <h3 class="font-semibold text-sm mb-1">${item.title}</h3>
                            <p class="text-xs text-gray-400 mb-3">${item.description}</p>
                        </div>
                        <button onclick="buyItem(${item.id}, ${item.price})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-xl text-xs transition">Купить за ⭐</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat) { currentCategory = cat; renderListings(); }

        async function createListing(e) {
            e.preventDefault();
            const data = {
                category: document.getElementById('item-category').value,
                game: document.getElementById('item-game').value,
                title: document.getElementById('item-title').value,
                price: parseInt(document.getElementById('item-price').value),
                description: document.getElementById('item-desc').value,
                seller_id: userId
            };

            const res = await fetch(`${BACKEND_URL}/api/listings`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Лот успешно выставлен за Telegram Stars!');
                document.getElementById('sell-form').reset();
                switchTab('market');
            } else { alert('Ошибка публикации'); }
        }

        async function buyItem(listingId, price) {
            if (!confirm(`Подтвердить покупку лота за ${price} ⭐?`)) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/buy`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ listing_id: listingId, buyer_id: userId })
                });
                const result = await res.json();
                if (res.ok) {
                    alert('Покупка успешна! Продавец получил звезды, а вам отправлено уведомление в чат бота.');
                    fetchListings();
                } else {
                    alert(result.detail || 'Ошибка при покупке');
                }
            } catch (e) { alert('Ошибка соединения с сервером'); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchListings();
        });
    </script>
</body>
</html>
